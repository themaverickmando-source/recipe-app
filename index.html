<!DOCTYPE html>
<!--
  Manolo's recipe book.

  This file is the skeleton of the page. It does not contain the recipes
  themselves. app.js reads those and fills in the list and the recipe screen.
  On a recipe, app.js also draws the − and + buttons that scale the amounts,
  the button that adds those amounts to the grocery list, and Start cooking.

  Start cooking opens one step at a time. That address looks like
  #cook/3/2 (recipe 3, step 2), so the phone Back button and a reload
  stay on the step you were reading.

  The bottom bar switches between the recipe cards and the grocery list.
  It hides while you are cooking, so Back and Next can sit on the bottom
  edge. The grocery list's address ends with #list, so the phone Back
  button can return to the recipes.

  Add recipe (on the list) opens a form at #new. Edit (on a recipe) opens
  #edit/ plus that recipe's id. Save writes the recipe on this phone.
  Cancel leaves without saving. Delete asks first. The starting recipes
  still come from data/recipes.json. Your changes are stored beside that
  file, so a newer copy of the file does not wipe what you typed.

  styles.css, app.js, and data/recipes.json are linked with relative paths
  (no leading slash). That keeps the site working when it is published at
  https://themaverickmando-source.github.io/recipe-app/
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Same hex as --paper in styles.css, so the phone browser bar matches the page. -->
  <meta name="theme-color" content="#1c1714">
  <!-- A tiny built-in icon, so the browser does not ask for a missing favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23f0b429'/%3E%3C/svg%3E">
  <title>Recipes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <!--
      Home screen: the search box and the recipe cards.
      app.js hides this whole section when a recipe or the grocery list is open.
    -->
    <main id="home">
      <header class="hero">
        <div class="panel">
          <p class="kicker">Manolo's kitchen</p>
          <h1>Recipes</h1>

          <div class="search-box">
            <label for="search">Search recipes</label>
            <input
              id="search"
              type="search"
              placeholder="shrimp, aioli, Italian…"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="search">
          </div>

          <p id="count" class="count" aria-live="polite"></p>
        </div>
      </header>

      <div class="panel list-panel">
        <!-- Big tap target. The address #new is the blank form. -->
        <a class="add-recipe" href="#new">Add recipe</a>
        <div id="list">
          <p class="loading">Loading recipes…</p>
        </div>
        <p id="empty" class="empty" hidden>No recipes match. Try a different word.</p>
      </div>
    </main>

    <!--
      Recipe screen. Empty until you open a card.
      The address will look like #recipe/3, and app.js fills this in.
    -->
    <article id="detail" class="panel detail-panel" hidden></article>

    <!--
      Grocery list. Empty until app.js draws it.
      The address will look like #list.
    -->
    <section id="grocery" class="panel grocery-panel" hidden>
      <p class="kicker">Manolo's kitchen</p>
      <h1>Grocery list</h1>
      <p id="grocery-summary" class="count"></p>
      <p id="grocery-notice" class="notice" role="status" hidden></p>
      <div id="grocery-body"></div>
    </section>

    <!--
      Cooking screen. Empty until Start cooking, or until the address is
      #cook/<id>/<step>. app.js fills in one step, the ingredients, and
      the Back / Next bar.
    -->
    <section id="cook" class="cook-screen" aria-label="Cooking" hidden></section>

    <!--
      Add and edit. Empty until the address is #new or #edit/<id>.
      app.js draws the form. Nothing is written until Save.
    -->
    <section id="editor" class="panel editor-panel" hidden></section>
  </div>

  <!--
    Always on screen, including on a recipe, so the list is one tap away.
    Each link only changes the hash. The page does not reload.
  -->
  <nav class="tabbar" aria-label="Sections">
    <a class="tab" id="tab-recipes" href="#">Recipes</a>
    <a class="tab" id="tab-list" href="#list">Grocery list <span id="grocery-count" class="tab-count" hidden></span></a>
  </nav>

  <noscript>
    <p class="empty panel">Turn on JavaScript to see your recipes. The script that runs them is app.js, on this same site.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
